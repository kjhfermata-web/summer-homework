        .gallery-link {
            display: inline-block; margin-top: 20px; padding: 12px 28px;

        .tab-nav { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }

        .loading { text-align: center; padding: 40px; color: #888; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .user-info { font-size: 0.85em; color: #888; }
        .logout-btn {

            padding: 6px 12px; cursor: pointer; font-size: 0.8em; color: #888;
        }

</style>

    "5": "sun05", "6": "sun06", "7": "sun07",

// ============================================
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 비밀미션 24가지
const missions = [
    "🌅 새벽에 일찍 일어나 산책하기",

];

let currentUser = null;
let currentMission = "";
let photoData = "";

// ============================================
// 페이지 렌더링
// ============================================
function renderLogin() {
    document.getElementById('app').innerHTML = `
        <h1>🌻 여름방학 안부전하기</h1>
        <p class="subtitle">선생님에게 안부를 전해주세요!</p>
        <div class="login-box">
            <h2>🔑 로그인</h2>
            <div class="input-group">
                <label>학번</label>
                <input type="text" id="studentId" placeholder="번호만 입력 (예: 1, 15...)" maxlength="10">
            </div>
            <div class="input-group">
                <label>개인 암호</label>
                <input type="password" id="password" placeholder="선생님이 알려준 나만의 암호">
            </div>
            <button class="login-btn" onclick="handleLogin()">로그인</button>
            <p class="error-msg" id="loginError">학번 또는 암호가 올바르지 않습니다.</p>
        </div>
    `;
}

function handleLogin() {
    const studentId = document.getElementById('studentId').value.trim();
    const password = document.getElementById('password').value;

    if (!studentId) {
        showLoginError('학번을 입력해주세요.');
        return;
    }
    if (!STUDENT_PASSWORDS[studentId]) {
        showLoginError('등록되지 않은 학번입니다.');
        return;
    }
    if (password !== STUDENT_PASSWORDS[studentId]) {
        showLoginError('암호가 올바르지 않습니다.');
        return;
    }

    currentUser = studentId;
    // Firebase에서 기존 데이터 확인
    db.ref('students/' + studentId).once('value').then(snapshot => {
        const data = snapshot.val();
        if (data && data.mission) {
            currentMission = data.mission;
        }
        if (data && data.photo) {
            photoData = data.photo;
        }
        renderMain();
        // 저장된 2단계 답변 복원
        if (data && data.answers) {
            const a1 = document.getElementById('answer1');
            const a2 = document.getElementById('answer2');
            const a3 = document.getElementById('answer3');
            if (a1) a1.value = data.answers.q1 || '';
            if (a2) a2.value = data.answers.q2 || '';
            if (a3) a3.value = data.answers.q3 || '';
        }
        // 저장된 3단계 댓글/사진 복원
        if (data && data.comment) {
            const cm = document.getElementById('comment');
            if (cm) cm.value = data.comment;
        }
        if (data && data.photo) {
            const img = document.getElementById('previewImg');
            if (img) { img.src = data.photo; img.style.display = 'block'; }
        }
    }).catch(() => {
        renderMain();
    });
}

function showLoginError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.style.display = 'block';
}

function renderMain() {
    const hasSubmitted = false;
    document.getElementById('app').innerHTML = `
        <div class="header-bar">
            <span class="user-info">👋 ${currentUser}번 학생</span>
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>
        <h1>🌻 여름방학 안부전하기</h1>
        <p class="subtitle">선생님에게 안부를 전해주세요!</p>

        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('intro')">🏠 안내</button>
            <button class="tab-btn" onclick="switchTab('task')">📝 과제하기</button>
            <button class="tab-btn" onclick="switchTab('gallery')">📸 갤러리</button>
        </div>

        <!-- Intro Tab -->
        <div id="introTab">
            <div style="background:linear-gradient(135deg,#f8f9fa,#e8f4f8); border-radius:16px; padding:24px; margin-bottom:20px;">
                <h2 style="color:#333; margin-bottom:16px; text-align:center;">📢 양동여중 3학년 2반</h2>
                <h3 style="color:#667eea; margin-bottom:14px; text-align:center;">여름방학 기본임무</h3>
                <div style="background:white; border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.05);">
                    <p style="color:#444; line-height:2; font-size:1.05em;">
                        <strong>1.</strong> 아프지 말 것<br>
                        <strong>2.</strong> 방학 동안 한번쯤은 누군가에게 친절할 것<br>
                        <strong>3.</strong> 개학 날 얼굴 보고 웃으며 인사할 것
                    </p>
                </div>
                <div style="text-align:center; margin-top:20px;">
                    <p style="font-size:1.1em; font-weight:bold; color:#764ba2;">그리고! 여러분의 3단계 방학 과제 하기 👇</p>
                    <p style="color:#e74c3c; margin-top:10px; font-weight:bold;">⏰ 제출기한 : 개학 전날 밤까지</p>
                </div>
            </div>
            <button class="next-btn" onclick="switchTab('task')">📝 과제하러 가기 →</button>
        </div>

        <div id="taskTab" style="display:none;">

                <button class="step-btn active" id="nav1" onclick="goToStep(1)">1</button>

                <div class="mission-area">
                    <div class="mission-card ${currentMission ? 'locked' : ''}" id="missionCard">

                        ${currentMission ? '✅ 미션 확정 완료' : '🎰 미션 뽑기!'}

                </div>
                <button class="next-btn" onclick="nextStep(2)">다음 단계로 →</button>
            </div>

            <!-- Step 2 -->

                <h2 class="section-title">📋 2단계: 생존신고서</h2>
                <p class="section-desc">방학 중 나의 일상을 알려주세요!</p>
                <div class="form-group">
                    <label>📍 질문 1. 방학 중 내가 가장 많이 있는 장소는?</label>
                    <textarea id="answer1" placeholder="예: 내 방, 거실 소파, 도서관..."></textarea>
                </div>
                <div class="form-group">
                    <label>😂 질문 2. 방학 중 가장 웃겼던 일 한 가지는?</label>
                    <textarea id="answer2" placeholder="예: 동생이랑 라면 끓이다가..."></textarea>

                <div class="form-group">
                    <label>🔁 질문 3. 방학 중 가장 많이 하는 것 한 가지는?</label>

                <div style="background:#fff8e1; border-radius:12px; padding:14px 16px; margin-bottom:16px; font-size:0.85em; color:#795548; line-height:1.6;">

                </div>
                <div class="upload-area" onclick="document.getElementById('photoInput').click()">
                    <input type="file" id="photoInput" accept="image/*" onchange="handlePhoto(event)">
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">클릭하여 사진 업로드<br>(자동으로 압축됩니다)</div>
                </div>
                <img class="preview-img" id="previewImg">
                <div class="form-group">
                    <label>💬 한마디 댓글 (미션 수행 소감)</label>
                    <textarea id="comment" placeholder="미션 수행하면서 느낀 점을 한마디로!"></textarea>
                </div>
                <button class="submit-btn" id="submitBtn" onclick="submitAll()">✅ 제출 완료!</button>
            </div>

            <!-- Complete -->
            <div class="section" id="completeSection">
                <div class="complete-screen" style="display:block;">
                    <div class="emoji">🎉</div>
                    <h2>안부 전하기 완료!</h2>
                    <p>잘 지내고 있구나! 고마워요 😊<br>남은 방학도 건강하고 즐겁게 보내세요!</p>
                    <a href="#" class="gallery-link" onclick="switchTab('gallery'); return false;">📸 갤러리 구경하기</a>
                </div>
            </div>
        </div>

        <div id="galleryTab" style="display:none;">
            <h2 class="section-title">📸 우리 반 인증 갤러리</h2>
            <p class="section-desc">친구들의 미션 수행 사진을 구경하세요!</p>
            <div class="gallery-grid" id="galleryGrid">
                <div class="loading">📡 불러오는 중...</div>
            </div>
        </div>
    `;

    // 기존 제출 여부 확인
    db.ref('students/' + currentUser).once('value').then(snapshot => {
        const data = snapshot.val();
        if (data && data.submitted) {
            showCompleteScreen();
        }
    });
}

function logout() {
    currentUser = null;
    currentMission = "";
    photoData = "";
    renderLogin();
}

// ============================================
// 탭 전환
// ============================================
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', 
            (tab === 'intro' && i === 0) || 
            (tab === 'task' && i === 1) || 
            (tab === 'gallery' && i === 2)
        );
    });
    document.getElementById('introTab').style.display = tab === 'intro' ? 'block' : 'none';
    document.getElementById('taskTab').style.display = tab === 'task' ? 'block' : 'none';
    document.getElementById('galleryTab').style.display = tab === 'gallery' ? 'block' : 'none';
    if (tab === 'gallery') loadGallery();
}

// ============================================
// 단계 이동
// ============================================
function goToStep(step) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('step' + step).classList.add('active');
    document.getElementById('nav' + step).classList.add('active');
}

function nextStep(step) {
    const prevNav = document.getElementById('nav' + (step - 1));
    prevNav.classList.remove('active');
    prevNav.classList.add('completed');
    goToStep(step);
}

// ============================================
// 2단계: 임시저장
// ============================================
function saveStep2() {
    const answer1 = document.getElementById('answer1').value.trim();
    const answer2 = document.getElementById('answer2').value.trim();
    const answer3 = document.getElementById('answer3').value.trim();

    db.ref('students/' + currentUser).update({
        answers: { q1: answer1, q2: answer2, q3: answer3 }
    }).then(() => {
        showSaveToast('💾 임시저장 완료!');
    });
}

function showSaveToast(msg) {
    const toast = document.createElement('div');
    toast.textContent = msg;
    toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 24px;border-radius:30px;font-size:0.9em;z-index:9999;animation:fadeIn 0.3s;';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

// ============================================
// 1단계: 미션 뽑기 (1회 제한)
// ============================================
function drawMission() {
    if (currentMission) {
        alert('이미 미션을 뽑았습니다! 당신이 뽑은 미션을 받아들이세요~ 😄');
        return;
    }

    const card = document.getElementById('missionCard');
    const btn = document.getElementById('drawBtn');
    card.classList.add('shaking');

    let randomIndex = Math.floor(Math.random() * missions.length);
    currentMission = missions[randomIndex];

    setTimeout(() => {
        card.classList.remove('shaking');
        card.textContent = currentMission;
        card.classList.add('locked');
        btn.disabled = true;
        btn.textContent = '✅ 미션 확정 완료';

        // Firebase에 미션 저장
        db.ref('students/' + currentUser).update({
            mission: currentMission,
            missionDrawnAt: new Date().toISOString()
        });
    }, 500);
}

// ============================================
// 3단계: 사진 처리 (압축)
// ============================================
function handlePhoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    // 이미지 압축 (최대 800px, 품질 0.6)
    compressImage(file, 800, 0.6).then(compressed => {
        photoData = compressed;
        const img = document.getElementById('previewImg');
        img.src = compressed;
        img.style.display = 'block';
        // 사진 즉시 저장
        db.ref('students/' + currentUser).update({ photo: compressed });
        showSaveToast('📷 사진 저장됨!');
    });
}

function compressImage(file, maxSize, quality) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                } else {
                    if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

// ============================================
// 제출
// ============================================
function submitAll() {
    const answer1 = document.getElementById('answer1').value.trim();
    const answer2 = document.getElementById('answer2').value.trim();
    const answer3 = document.getElementById('answer3').value.trim();
    const comment = document.getElementById('comment').value.trim();

    if (!currentMission) {
        alert('1단계에서 비밀미션을 먼저 뽑아주세요! 🎲');
        goToStep(1);
        return;
    }
    if (!answer1 || !answer2 || !answer3) {
        alert('2단계 질문에 모두 답해주세요! 📋');
        goToStep(2);
        return;
    }
    if (!photoData) {
        alert('3단계에서 인증 사진을 올려주세요! 📸');
        return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '⏳ 제출 중...';

    const submissionData = {
        studentId: currentUser,
        mission: currentMission,
        answers: { q1: answer1, q2: answer2, q3: answer3 },
        photo: photoData,
        comment: comment,
        submittedAt: new Date().toISOString(),
        submitted: true,
        likes: {}
    };

    db.ref('students/' + currentUser).set(submissionData).then(() => {
        showCompleteScreen();
    }).catch(err => {
        alert('제출 중 오류가 발생했습니다. 다시 시도해주세요.');
        btn.disabled = false;
        btn.textContent = '✅ 제출 완료!';
        console.error(err);
    });
}

function showCompleteScreen() {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelector('.steps-nav').style.display = 'none';
    document.getElementById('completeSection').classList.add('active');
}

// ============================================
// 갤러리
// ============================================
function loadGallery() {
    const grid = document.getElementById('galleryGrid');
    grid.innerHTML = '<div class="loading">📡 불러오는 중...</div>';

    db.ref('students').orderByChild('submittedAt').once('value').then(snapshot => {
        const items = [];
        snapshot.forEach(child => {
            const data = child.val();
            if (data.submitted && data.photo) {
                items.push({ ...data, key: child.key });
            }
        });

        // 최신순 정렬
        items.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));

        if (items.length === 0) {
            grid.innerHTML = '<div class="loading">아직 제출된 사진이 없어요 🙈</div>';
            return;
        }

        grid.innerHTML = items.map(item => {
            const date = new Date(item.submittedAt);
            const dateStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2,'0')}`;
            const likeCount = item.likes ? Object.keys(item.likes).length : 0;
            const isLiked = item.likes && item.likes[currentUser];

            return `
                <div class="gallery-item">
                    <img src="${item.photo}" alt="인증사진">
                    <div class="gallery-meta">
                        <span class="gallery-student">${item.studentId}번 학생</span>
                        <span class="gallery-date">${dateStr}</span>
                    </div>
                    <div class="gallery-mission">${item.mission}</div>
                    <div class="gallery-comment">${item.comment || ''}</div>
                    <div style="margin-top:10px;">
                        <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${item.key}')">
                            ${isLiked ? '❤️' : '🤍'} <span>${likeCount}</span>
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    });
}

function toggleLike(studentKey) {
    const likeRef = db.ref('students/' + studentKey + '/likes/' + currentUser);
    likeRef.once('value').then(snapshot => {
        if (snapshot.val()) {
            likeRef.remove().then(() => loadGallery());
        } else {
            likeRef.set(true).then(() => loadGallery());
        }
    });
}

// ============================================
// 초기 실행
// ============================================
renderLogin();
</script>
